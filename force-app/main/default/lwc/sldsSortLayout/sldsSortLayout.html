<template>
    <template lwc:if={toastObj}>
        <div class="slds-align_absolute-center">
            <c-toast-lwc
                variant={toastObj.variant}
                mode={toastObj.mode}
                object-api-name={toastObj.objectApiName}
                header={toastObj.header}
                message={toastObj.message}
            ></c-toast-lwc>
        </div>
    </template>
  <template lwc:if={hasSortRows}>
    <div class="sort-wrapper">
        <template for:each={rows} for:item="row">
        <div key={row.keyId}>
            <span class="box-label">
            <abbr
                if:true={row.showRequired}
                class="slds-required"
                title="required"
                aria-hidden="true"
                >*</abbr
            >
            {row.rowLabel}
            </span>

            <div class="slds-box">
            <div class="slds-grid slds-grid_vertical-align-center slds-grid_vertical-stretch slds-p-horizontal_small">
                <div class="slds-p-right_small slds-align-middle">
                <ul class="slds-button-group-list">
                    <li>
                    <button
                        class={row.moveUpButtonClass}
                        title="Move sort column up"
                        disabled={row.isFirst}
                        onclick={moveSortColUp}
                        data-key-id={row.keyId}
                    >
                        <svg class="slds-button__icon" aria-hidden="true">
                        <use xlink:href={iconMap.utility.arrowup}></use>
                        </svg>
                        <span class="slds-assistive-text"
                        >Move sort column up</span
                        >
                    </button>
                    </li>
                    <li>
                    <button
                        class={row.moveDownButtonClass}
                        title="Move sort column down"
                        disabled={row.isLast}
                        onclick={moveSortColDown}
                        data-key-id={row.keyId}
                    >
                        <svg class="slds-button__icon" aria-hidden="true">
                        <use xlink:href={iconMap.utility.arrowdown}></use>
                        </svg>
                        <span class="slds-assistive-text"
                        >Move sort column down</span
                        >
                    </button>
                    </li>
                </ul>
                </div>

                <div class="slds-p-right_small slds-align-middle slds-grow slds-p-right_small"
                    style="max-width: 300px;"
                >   
                <c-slds-combobox-portal
                    options={row.availableFieldOptions}
                    current-value={row.fieldApiName}
                    place-holder="Select a column"
                    onselected={handleSortColFieldSelection}
                    data-key-id={row.keyId}
                    dropdown-length="7"
                    suppress-margin="true"
                ></c-slds-combobox-portal>
                </div>

                <div class="slds-p-right_small slds-align-middle">
                    <c-slds-radio-button-group
                        font-size="0.85rem"
                        options={sortDirectionOptions}
                        current-value={row.isAscending}
                        onchange={handleAscendingChange}
                        data-key-id={row.keyId}
                    ></c-slds-radio-button-group>
                </div>

                <div class="slds-col_bump-left slds-align-middle">
                <button
                    class="slds-button slds-button_icon slds-button_icon slds-button_icon-small"
                    title="Remove sort column"
                    data-key-id={row.keyId}
                    onclick={removeSortCol}
                >
                    <svg
                    class="slds-button__icon slds-button__icon_hint"
                    aria-hidden="true"
                    >
                    <use xlink:href={iconMap.utility.delete}></use>
                    </svg>
                    <span class="slds-assistive-text">Remove Column</span>
                </button>
                </div>
            </div>
            </div>
        </div>
        </template>
    </div>

    <div class="slds-p-vertical_small slds-grid slds-grid_align-spread">
      <div>
        <button
          class="slds-button"
          disabled={isAddSortColDisabled}
          onclick={addSortCol}
        >
          <svg
            class="slds-button__icon slds-button__icon_left"
            aria-hidden="true"
          >
            <use xlink:href={iconMap.utility.add}></use>
          </svg>
          Add a sort column
        </button>
      </div>
      <div>{columnLimitLabel}</div>
    </div>
  </template>
</template>
