		<ul class="slds-tabs_default__nav" role="tablist" 
			style="background-color: var(--slds-g-color-neutral-base-100);"

						data-id="tab1"
						tabindex={tab1TI} aria-selected={tab1Aria}
						aria-controls="panel-tab1" id="link-tab1"
						onclick={onTabClick}

					>{tab1Label}</a>

						id="link-tab2"

			<template lwc:if={tab5Label}>

			<template lwc:if={tab6Label}>
				<li class={tab6ItemClass} role="presentation" title={tab3Label} data-id="tab3">
					<a class="slds-tabs_default__link"
						href="#" role="tab"
						data-id="tab6"
						tabindex={tab6TI} aria-selected={tab6Aria}
						aria-controls="panel-tab6" id="link-tab6"

			<template lwc:if={tab7Label}>
				<li class={tab7ItemClass} role="presentation" title={tab3Label} data-id="tab3">

					<a class="slds-tabs_default__link"
						href="#" role="tab"

						tabindex={tab8TI} aria-selected={tab8Aria}

			<!-- Overflow button -->
			<template lwc:if={hasOverflow}>
				<li class={overflowItemClass} role="presentation" data-tab-id="overflow"> 
					<div class="slds-dropdown-trigger slds-dropdown-trigger_click">
						<c-slds-menu-popover-button 
							options={hiddenTabs}
							value={_active}
							is-left="false"
							is-check="true"
							onselection={onOverflowItemClick}
						>	
							<button class={overflowButtonClass} aria-haspopup="true" role="tab"
								data-id="overflow"
								tabindex={overflowTI}
								aria-selected={overflowAria}
								onkeydown={onTabKeyDown}
							>
								More
								<svg class="slds-button__icon slds-button__icon_small slds-button__icon_right" aria-hidden="true">
									<use xlink:href={iconMap.utility.down}></use>
								</svg>
							</button>
						</c-slds-menu-popover-button>
					</div>
				</li>
			</template>
		</ul>

		<!-- Panels -->
		<template lwc:if={tab1Label}>
			<div id="panel-tab1" data-panel-id="tab1" class={tab1PanelClass} role="tabpanel" aria-labelledby="link-tab1" onkeydown={onPanelKeyDown}>

			</div>
		</template>
