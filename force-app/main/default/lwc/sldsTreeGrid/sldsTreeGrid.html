                                                                                                <use xlink:href={iconMap.utility.chevrondown}></use>
                                                                                            </svg>
                                                                                            <span class="slds-assistive-text">Show Account Name column actions</span>
                                                                                        </button>
                                                                                    </c-slds-menu-popover-button>
                                                                                </td>
                                                                            </template>
                                                                        </template>
                                                                        
                                                                    </template>
                                                                </tr>
                                                                <!--End Level 2 Fields-->

                                                                <!--Level 3 Table-->
                                                                <template lwc:if={childit.value.children}>
                                                                    
                                                                    <tr class="slds-hide nested-table-container" 
                                                                        key={childit.value.keyId} tabindex="-1" style="border-top: none; border-bottom: none;"
                                                                        aria-level="3" aria-posinset="2" aria-selected="false" aria-setsize="0"  
                                                                        data-parent-id={childit.value.Id} data-element="childRowControl"
                                                                    >
                                                                        <!--Level 3 td indent-->
                                                                        <td
                                                                            colspan="1"
                                                                            class="indent-td"
                                                                            data-indent-id={childit.value.Id}
                                                                            data-style="treeHighlight"
                                                                        >
                                                                            <span class="indent-highlight"></span>
                                                                            <template lwc:if={iconLevel3}> 
                                                                                <div class="slds-p-left_x-small indent-icon-wrap"> 
                                                                                    <lightning-icon 
                                                                                        icon-name={iconLevel3.icon}
                                                                                        size={iconLevel3.size}
                                                                                        class={iconLevel3.cl}
                                                                                        title={iconLevel3.iconTitle}
                                                                                    ></lightning-icon>
                                                                                </div> 
                                                                            </template>
                                                                        </td>

                                                                        <!--Level 3 td Wrapper-->
                                                                        <th
                                                                            colspan={childColAmount}
                                                                            tabindex="-1"
                                                                            class="nested-table-td-wrapper"
                                                                            data-parent={row.Id}
                                                                            data-td-wrapper-parent={childit.value.Id}
                                                                            onmouseenter={handleMouseEnter}
                                                                            onmouseleave={handleMouseLeave}
                                                                        >
                                                                            <div class="nested-table-wrapper" data-parent-wrapper={row.Id} data-parent-id={childit.value.Id} data-element="nestedTableWrapper" data-level="3">
                                                                                <!--Level 3 Table-->
                                                                                <table  class={tableCls.child}
                                                                                    aria-multiselectable="true" aria-label="Example default tree grid"
                                                                                    data-table-type="grandchild" 
                                                                                    data-indent-id={childit.value.Id} 
                                                                                    data-style="treeHighlight" 
                                                                                    data-parent-id={childit.value.Id}  
                                                                                >   
                                                                                    <!--Level 3 Header-->
                                                                                    <thead> 
                                                                                        <tr class="slds-line-height_reset nested-col-tr">
                                                                                            <!--Level 3 Checkbox-->
                                                                                            <th if:false={suppressCheckboxes3}
                                                                                                class="slds-cell_action-mode
                                                                                                slds-text-align_right
                                                                                                action-col
                                                                                                check-th-normal"
                                                                                                scope="col"
                                                                                                data-id="actionTh"
                                                                                            >
                                                                                                <div class="slds-th__action slds-th__action_form">
                                                                                                    <c-tree-checkbox 
                                                                                                        level="grandchild" 
                                                                                                        value="select all grandchildren" 
                                                                                                        is-select-all="true"
                                                                                                        onchecked={handleChecked}
                                                                                                        onunchecked={handleUnChecked}
                                                                                                        data-is-select-all="true"
                                                                                                        data-level="grandchild"
                                                                                                        data-parent-id={childit.value.Id}
                                                                                                    ></c-tree-checkbox>
                                                                                                </div>
                                                                                            </th>
                                                                                            <!--End Level 3 Checkbox-->
                                                                        
                                                                                            <!--Level 3 Columns-->
                                                                                            <template iterator:grandchildit={levelThreeColumns}>
                                                                                                <template if:false={grandchildit.value.isReference}> 
                                                                                                    <th key={grandchildit.value.keyId}
                                                                                                        aria-sort="none"
                                                                                                        class="nested-th slds-has-button-menu slds-is-sortable slds-is-resizable dv-dynamic-width col-th"
                                                                                                        scope="col"
                                                                                                        width={grandchildit.value.width}
                                                                                                        data-col-type="grandchild"
                                                                                                        data-id="headerTh"
                                                                                                    >
                                                                                                        
                                                                                                        <a class="slds-th__action slds-text-link_reset child-columns sortable-col" href="#" role="button" tabindex="-1">
                                                                                                            <span class="slds-assistive-text">Sort by: </span>
                                                                                                            <div class="slds-grid slds-grid_vertical-align-center slds-has-flexi-truncate">
                                                                                                                <span class="slds-truncate" title={grandchildit.value.displayValue}>{grandchildit.value.displayValue}</span>
                                                                                                            </div>
                                                                                                        </a>

                                                                                                        <!--Level 3 Col Actions Button-->
                                                                                                        <template if:false={suppressColActions}>
                                                                                                            <c-slds-menu-popover-button 
                                                                                                                options={utility.colTextOptions}
                                                                                                                value={grandchildit.value.textStyle} 
                                                                                                                is-left="false"
                                                                                                                is-check="true"
                                                                                                                data-level="3"
                                                                                                                menu-id={grandchildit.value.colId}
                                                                                                                onselection={handleColAction}
                                                                                                            >
                                                                                                                <button class="slds-button slds-button_icon slds-th__action-button slds-button_icon-x-small" 
                                                                                                                    aria-haspopup="true" 
                                                                                                                    tabindex="-1" 
                                                                                                                    title="Show column actions"
                                                                                                                >
                                                                                                                    <svg class="slds-button__icon slds-button__icon_hint slds-button__icon_small tree-icon" aria-hidden="true">
                                                                                                                        <use xlink:href={iconMap.utility.chevrondown}></use>
                                                                                                                    </svg>
                                                                                                                    <span class="slds-assistive-text">Show column actions</span>
                                                                                                                </button>
                                                                                                            </c-slds-menu-popover-button>
                                                                                                        </template>
                                                                                                        <!--End Level 3 Col Actions Button-->

                                                                                                        <!--Min-Width: 120px-->
                                                                                                        <div class="slds-resizable">
                                                                                                            <input if:true={grandchildit.first} type="range" aria-label="Account Name column width" class="slds-resizable__input slds-assistive-text" id={grandchildit.value.label} max="1000" min="120" tabindex="0" />
                                                                                                            <input if:false={grandchildit.first} type="range" aria-label="Account Name column width" class="slds-resizable__input slds-assistive-text" id={grandchildit.value.label} max="1000" min="80" tabindex="0" />
                                                                                                            <span class="slds-resizable__handle" onmousedown={handlemousedown} onmouseenter={handleMouseEnter}>
                                                                                                                <span class="slds-resizable__divider"></span>
                                                                                                            </span>
                                                                                                        </div>
                                                                                                        <!--End Min-Width: 120px-->
                                                                                                    </th>
                                                                                                </template>
                                                                                            </template>
                                                                                            <!--End Loop Level 3 Columns-->
                                                                                            
                                                                                            <!--Level 3 Actions Button-->
                                                                                            <th class="nested-th child-columns slds-cell-fixed action-col" scope="col" data-id="actionTh" style="width: 3.25rem;">
                                                                                                <div class="slds-truncate slds-assistive-text" title="Actions">Actions</div>
                                                                                            </th>
                                                                                        </tr>
                                                                                    </thead>
                                                                                    <!--End Level 3 Header Row-->

                                                                                    <!--Level 3 Body-->
                                                                                    <tbody class="child-tbody">
                                                                                        <template lwc:if={childit.value.children.length}>
                                                                                        <!--Level 3 Fields-->
                                                                                        <template iterator:gchildit={childit.value.children}>
                                                                                            <tr class="slds-hint-parent"
                                                                                                key={gchildit.value.kParent}
                                                                                                tabindex="-1"
                                                                                                aria-level="1"
                                                                                                aria-expanded="false"
                                                                                                aria-posinset="1"
                                                                                                aria-selected="false" 
                                                                                                aria-setsize="1" 
                                                                                                data-row-id={gchildit.value.Id} 
                                                                                            >   
                                                                                                <!--Level 3 Field Checkbox-->
                                                                                                <td class="slds-text-align_right" role="gridcell" style="width:3.25rem">
                                                                                                    <c-tree-checkbox 
                                                                                                        level="grandchild" 
                                                                                                        value={gchildit.value.Id} 
                                                                                                        is-select-all="false"
                                                                                                        onchecked={handleChecked}
                                                                                                        onunchecked={handleUnChecked}
                                                                                                        data-is-select-all="false"
                                                                                                        data-level="grandchild"
                                                                                                        data-parent-id={childit.value.Id}
                                                                                                        data-record-id={gchildit.value.Id}
                                                                                                    ></c-tree-checkbox>
                                                                                                </td>
                                                                                                <!--End Level 3 Field Checkbox-->

                                                                                                <!--Level 3 Fields-->
                                                                                                <template iterator:it={gchildit.value.fields}>
                                                                                                    <!--Level 3 First Field in Row-->
                                                                                                    <template lwc:if={it.first}> 
                                                                                                        <th key={it.value.keyId}
                                                                                                            scope="row"
                                                                                                            data-id={it.value.fieldId}                
                                                                                                            class="slds-tree__item slds-cell-edit slds-cell-wrap level-3-cell"
                                                                                                            data-label={it.value.displayValue} 
                                                                                                            data-field-name={it.value.fieldName} 
                                                                                                            data-record-id={gchildit.value.Id}
                                                                                                            data-table-level="levelThree"
                                                                                                        >   
                                                                                                            <!--Edit Popover Anchor-->
                                                                                                            <span class="popover-anchor" data-row-id={gchildit.value.Id}></span>

                                                                                                            <span class="slds-grid slds-grid_vertical-align-center">
                                                                                                                <!--Level 3 Collapse Row Button-->
                                                                                                                <span class="slds-no-flex"> 
                                                                                                                    <!--Enabled-->
                                                                                                                    <button if:true={gchildit.value.children} class="slds-button slds-button_icon slds-button_icon-x-small slds-m-right_x-small" tabindex="0" title="Collapse">
                                                                                                                        <svg class="slds-button__icon slds-button__icon_small tree-icon">
                                                                                                                            <use xlink:href={iconMap.utility.chevronright}></use>
                                                                                                                        </svg>
                                                                                                                        <span class="slds-assistive-text">Expand</span>
                                                                                                                    </button>
                                                                                                                    <!--Disabled-->
                                                                                                                    <button if:false={gchildit.value.children} class="slds-button slds-button_icon slds-button_icon-x-small slds-m-right_x-small slds-is-disabled" aria-hidden="true" tabindex="-1" title="Collapse">
                                                                                                                        <svg class="slds-button__icon slds-button__icon_small tree-icon">
                                                                                                                            <use xlink:href={iconMap.utility.chevronright}></use>
                                                                                                                        </svg>
                                                                                                                        <span class="slds-assistive-text">Expand</span>
                                                                                                                    </button>
                                                                                                                </span>
                                                                                                                <!--Level 3 Collapse Row Button-->

                                                                                                                <!--Level 3 Field Value-->
                                                                                                                <span class="slds-truncate"
                                                                                                                    data-cell-field-name={it.value.fieldName}
                                                                                                                    data-table-level="levelThree" 
                                                                                                                    title={it.value.displayValue}
                                                                                                                >{it.value.displayValue}</span>
                                                                                                                <!--End Level 3 Field Value-->
                                                                                                                
                                                                                                                <!--Level 3 Edit/Locked Icons-->
                                                                                                                <span class="slds-col_bump-left slds-no-flex"> 
                                                                                                                    <!--Edit Field Icon-->
                                                                                                                    <template lwc:if={it.value.isEditable}>
                                                                                                                        <button 
                                                                                                                            class="slds-button slds-button_icon slds-cell-edit__button slds-m-left_x-small" 
                                                                                                                            tabindex="0" 
                                                                                                                            data-id={gchildit.value.Id} 
                                                                                                                            data-field-id={it.value.fieldId}
                                                                                                                            data-child-accessor={gchildit.value.childAccessor}
                                                                                                                            data-level="3"
                                                                                                                            onclick={handleEditClick}
                                                                                                                            onfocus={focusEditButton} 
                                                                                                                            onblur={blurEditButton}
                                                                                                                        >
                                                                                                                            <svg class="slds-button__icon slds-button__icon_hint slds-button__icon_edit" aria-hidden="true">
                                                                                                                                <use xlink:href={iconMap.utility.edit}></use>
                                                                                                                            </svg>
                                                                                                                            <span class="slds-assistive-text">Edit {it.value.fieldName} of {it.value.displayValue}</span>
                                                                                                                        </button>
                                                                                                                    </template>
                                                                                                                    <!--End Edit Field Icon-->
                                                                                                                    <!--Locked Field Icon-->
                                                                                                                    <template lwc:else> 
                                                                                                                        <button class="slds-button slds-button_icon slds-cell-edit__button slds-m-left_x-small no-flip" disabled="" tabindex="0" title="Edit">
                                                                                                                            <svg class="slds-button__icon slds-button__icon_hint slds-button__icon_lock slds-button__icon_small" aria-hidden="true">
                                                                                                                                <use xlink:href={iconMap.utility.lock}></use>
                                                                                                                            </svg>
                                                                                                                            <span class="slds-assistive-text">Edit</span>
                                                                                                                        </button>
                                                                                                                    </template>
                                                                                                                    <!--End Locked Field Icon-->
                                                                                                                </span>
                                                                                                                <!--End Level 3 Edit/Locked Icons-->
                                                                                                            </span>
                                                                                                        </th>
                                                                                                    </template>
                                                                                                    <!--End Level 3 First Field in Row-->

                                                                                                    <!--Level 3 Field Cell-->
                                                                                                    <template lwc:else> 
                                                                                                        <!--Hide Level 3 Reference Fields-->
                                                                                                        <template if:false={it.value.isReference}>
                                                                                                            <td class="slds-cell-edit slds-cell-wrap level-3-cell"
                                                                                                                key={it.value.keyId} 
                                                                                                                role="gridcell" 
                                                                                                                data-field-name={it.value.fieldName} 
                                                                                                                data-record-id={gchildit.value.Id} 
                                                                                                                data-label={it.value.displayValue} 
                                                                                                                data-id={it.value.fieldId}
                                                                                                                data-table-level="levelThree"
                                                                                                                onblur={blurCell} 
                                                                                                                onclick={focusCell}
                                                                                                            >
                                                                                                                <span class="popover-anchor" data-row-id={row.Id}></span>

                                                                                                                <!--Level 3 Field Value / Edit Icon-->
                                                                                                                <span class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center"> 
                                                                                                                    <!--Field Value-->
                                                                                                                    <span class="slds-truncate"
                                                                                                                        data-cell-field-name={it.value.fieldName}
                                                                                                                        data-table-level="levelThree"
                                                                                                                    >
                                                                                                                        <template lwc:if={it.value.url}> 
                                                                                                                            <a class="slds-text-link slds-truncate"
                                                                                                                                title={it.value.displayValue}
                                                                                                                                href={it.value.url}
                                                                                                                                data-cell-field-name={it.value.fieldName}
                                                                                                                                data-table-level="levelThree"
                                                                                                                            > 
                                                                                                                                <template lwc:if={it.value.textClass}>
                                                                                                                                    <span class={it.value.textClass}
                                                                                                                                        data-cell-field-name={it.value.fieldName}
                                                                                                                                        data-table-level="levelThree"
                                                                                                                                    >{it.value.displayValue}</span>
                                                                                                                                </template>
                                                                                                                                <template lwc:else>
                                                                                                                                    <span class="slds-truncate"
                                                                                                                                        data-cell-field-name={it.value.fieldName}
                                                                                                                                        data-table-level="levelThree"
                                                                                                                                    >{it.value.displayValue}</span>
                                                                                                                                </template>
                                                                                                                            </a>
                                                                                                                        </template>
                                                                                                                        <template lwc:else> 
                                                                                                                            <span class="slds-truncate"
                                                                                                                                data-cell-field-name={it.value.fieldName}
                                                                                                                                data-table-level="levelThree"
                                                                                                                                title={it.value.displayValue}
                                                                                                                            >{it.value.displayValue}</span>
                                                                                                                        </template>
                                                                                                                    </span>
                                                                                                                    <!--End Field Value-->

                                                                                                                    <!--Locked/Edit Icon-->
                                                                                                                    <span class="slds-no-flex">
                                                                                                                        <template lwc:if={it.value.isEditable}>
                                                                                                                            <button 
                                                                                                                                class="slds-button slds-button_icon slds-cell-edit__button slds-m-left_xx-small" 
                                                                                                                                tabindex="0" 
                                                                                                                                data-id={row.Id} 
                                                                                                                                data-field-id={it.value.fieldId}
                                                                                                                                data-level="1"
                                                                                                                                onclick={handleEditClick}
                                                                                                                                onfocus={focusEditButton}
                                                                                                                                onblur={blurEditButton}
                                                                                                                            >
                                                                                                                                <svg class="slds-button__icon slds-button__icon_hint slds-button__icon_edit current-color-icon" aria-hidden="true">
                                                                                                                                    <use xlink:href={iconMap.utility.edit}></use>
                                                                                                                                </svg>
                                                                                                                                <span class="slds-assistive-text">Edit {it.value.fieldName} of {it.value.displayValue}</span>
                                                                                                                            </button>
                                                                                                                        </template>
                                                                                                                        <!--Locked Field Icon-->
                                                                                                                        <template lwc:else> 
                                                                                                                            <button 
                                                                                                                                class="slds-button slds-button_icon slds-cell-edit__button slds-m-left_xx-small no-flip"
                                                                                                                                disabled=""
                                                                                                                                tabindex="0"
                                                                                                                                title="Edit"
                                                                                                                            >
                                                                                                                                <svg class="slds-button__icon slds-button__icon_hint slds-button__icon_lock current-color-icon slds-button__icon_small" aria-hidden="true">
                                                                                                                                    <use xlink:href={iconMap.utility.lock}></use>
                                                                                                                                </svg>
                                                                                                                                <span class="slds-assistive-text">Edit</span>
                                                                                                                            </button>
                                                                                                                        </template>
                                                                                                                        <!--End Locked Field Icon-->
                                                                                                                    </span>
                                                                                                                    <!--End Locked/Edit Icon-->
                                                                                                                </span>
                                                                                                                <!--End Level 3 Field Value / Edit Icon-->
                                                                                                            </td>
                                                                                                        </template>
                                                                                                        <!--End Hide Level 3 Reference Fields-->
                                                                                                    </template>
                                                                                                    <!--End Level 3 Field Cell-->

                                                                                                    <!--Level 3 Actions Button-->
                                                                                                    <template if:false={suppressColActions}>
                                                                                                        <template lwc:if={it.last}> 
                                                                                                            <td key={it.last} role="gridcell" style="width:3.25rem" data-record-id={gchildit.value.Id} data-is-child="false" data-is-grandparent="true" data-is-parent="false">
                                                                                                                
                                                                                                                <c-slds-menu-popover-button 
                                                                                                                    options={rowActions3}
                                                                                                                    is-left="false"
                                                                                                                    menu-id={gchildit.value.Id}
                                                                                                                    onselection={_handleRowAction}
                                                                                                                >
                                                                                                                    <button 
                                                                                                                        class="slds-button slds-button_icon slds-button_icon-border-filled slds-button_icon-x-small circle-button" 
                                                                                                                        aria-haspopup="true" 
                                                                                                                        tabindex="-1" 
                                                                                                                        title=""
                                                                                                                    >
                                                                                                                        <svg class="slds-button__icon slds-button__icon_hint slds-button__icon_small slds-button__icon_stateful tree-icon" aria-hidden="true">
                                                                                                                            <use xlink:href={iconMap.utility.chevrondown}></use>
                                                                                                                        </svg>
                                                                                                                        <span class="slds-assistive-text">Show Account Name column actions</span>
                                                                                                                    </button>
                                                                                                                </c-slds-menu-popover-button>
                                                                                                            </td>
                                                                                                        </template>
                                                                                                    </template>
                                                                                                    <!--End Level 3 Actions Button-->
                                                                                                    
                                                                                                </template>
                                                                                            </tr>
                                                                                            
                                                                                        </template>
                                                                                        <!--End Level 3 childit.values-->
                                                                                        </template>
                                                                                        <template lwc:else> 
                                                                                            <tr>
                                                                                                <td colspan={levelThreeColumns.length}> 
                                                                                                </td>
                                                                                            </tr>
                                                                                        </template>
                                                                                    </tbody>
                                                                                    <!--End Level 3 Body-->
                                                                                    
                                                                                </table>
                                                                                <!--End Level 3 Table-->
                                                                            </div>
                                                                        </th>
                                                                        <!--End Level 3 td Wrapper-->

                                                                    </tr>
                                                                </template>
                                                                <!--End Level 3 tr Wrapper-->

                                                            </template>
                                                        </template>
                                                        <template lwc:else> 
                                                            <tr 
                                                                tabindex="-1" 
                                                                aria-level="1" 
                                                                aria-expanded="false" 
                                                                aria-posinset="1" 
                                                                aria-selected="false" 
                                                                aria-setsize="1"  
                                                                data-element="fieldRow" 
                                                            >
                                                                <td colspan={levelTwoColumns.length}> 
                                                                    <div class="slds-grid_align-absolute-center slds-p-around_small"> 
                                                                        <c-slds-illustration 
                                                                            help-text={noDataMessageLevel2}
                                                                        ></c-slds-illustration>
                                                                    </div>
                                                                </td>
                                                            </tr>
                                                        </template>
                                                        <!--End Level 2 Rows-->
                                                    </tbody>
                                                    <!--End Level 2 Body-->
                                                    
                                                </table>
                                                <!--End Level 2 Table-->
                                            </div>
                                        </th>
                                        <!--End Level 2 td Wrapper-->
                                    </tr>
                                    <!--End Level 2 tr Wrapper-->
                                </template>
                                <!--End Level 2 Table-->

                            </template>
                        </tbody>
                    </table>
                </div>
                <!--End Tree Grid Table-->
            </div>
        </template>
        <!--End Tree Grid-->

        <template lwc:if={isTableEdited}>
            <footer class={footerBgClass} style="position: sticky; bottom: 0;">
                <div class="slds-grid slds-grid_align-center slds-gutters_xx-small"> 
                    <div class="slds-col"> 
                        <button class="slds-button slds-button_neutral" onclick={cancelEdits}>Cancel</button>
                    </div>
                    <div class="slds-col"> 
                        <button class="slds-button slds-button_brand" onclick={saveEdits}>Save</button>
                    </div>
                </div>
            </footer>
        </template>

        <!--template lwc:if={isPaginator}> 
            <template lwc:if={paginatedRowsMeta}>
                <c-slds-footer color="medium" is-slot="true" size="small">
                    <c-slds-table-paginator
                        active-page={pageInfo.activePage}
                        page-details={pageInfo}
                        page-meta={paginatedRowsMeta}
                        oncombometaselection={handlePageChange}
                    ></c-slds-table-paginator>
                </c-slds-footer>
            </template>
        </template-->

    </div>
</template>
