        <!--Help Text-->
        <template lwc:if={isDashThrough}> 
            <div style="text-align: center; display: flex; align-items: center; padding-top: 1.0rem;">
                <div class="line-through line-through_left"></div>
                <h3 class="line-through_text">{_helpText}</h3>
                <div class="line-through line-through_right"></div>
            </div>
            <template lwc:if={additionalHelpTextSlot}> 
                <slot name="additionalHelpTextSlot"></slot>
            </template>
            <template lwc:else>
                <div class="slds-text-longform">
                    <p if:true={_additionalHelpText} class="slds-text-body_regular">{_additionalHelpText}</p>
                </div>
            </template>
        </template>
        <template lwc:else>
        
            <div class="slds-text-longform">
                <h3 class={_helpTextCl}>{_helpText}</h3>
                <template lwc:if={additionalHelpTextSlot}> 
                    <slot name="additionalHelpTextSlot"></slot>
                </template>
                <template lwc:else>
                    <template lwc:if={_isAdditionalHelpTextArr}> 
                        <template for:each={_additionalHelpText} for:item="txt"> 
                            <p key={txt.keyId}>{txt.msg}</p>
                        </template>
                    </template>
                    <template lwc:else> 
                        <p if:true={_additionalHelpText}>{_additionalHelpText}</p>
                    </template>
                </template>
            </div>
        
        </template>
        <!--End Help Text-->
            
        <!--Call To Action Footer-->
        <footer if:true={callToAction} class="slds-card__footer">
            <button onclick={handleCallToAction} class={buttonCl}>{callToAction}</button>
        </footer>
        <!--End Call To Action Footer-->
    </div>
</template>
