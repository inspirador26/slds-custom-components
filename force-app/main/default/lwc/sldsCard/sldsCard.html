<template>
    <template lwc:if={toastObj}>
        <div class="slds-align_absolute-center">
            <c-toast-lwc
                variant={toastObj.variant}
                mode={toastObj.mode}
                object-api-name={toastObj.objectApiName}
                header={toastObj.header}
                message={toastObj.message}
            ></c-toast-lwc>
        </div>
    </template>

    <template lwc:if={bodyOnly}> 
        <article class="slds-card">
            <div class="slds-card__body slds-card__body_inner">
                <slot name="cardBodyAlt"></slot>
            </div>
        </article>
    </template>
    <template lwc:else> 
        <article class={cardClasses}>
            <template lwc:if={cardLabel}>
                <div class="slds-card__header slds-grid">
                    <header class="slds-media slds-media_center slds-has-flexi-truncate">
                        <template lwc:if={_iconConfig}>
                            <div class="slds-media__figure">
                                <span class={_iconConfig.container} title={iconLabel}>
                                    <svg class={_iconConfig.svg} aria-hidden="true">
                                        <use xlink:href={_iconConfig.icon}></use>
                                    </svg>
                                </span>
                            </div>
                        </template>
                        <div class="slds-media__body">
                            <h2 class="slds-card__header-title">
                                <template lwc:if={headerLink}>
                                    <a href="#" class="slds-card__header-link slds-truncate" title={cardLabel}>
                                        <span data-id="cardLabel">{cardLabel}</span>
                                    </a>
                                </template>
                                <template lwc:else> 
                                    <span title={cardLabel} data-id="cardLabel" class="slds-truncate">{cardLabel}</span>
                                </template>
                            </h2>
                        </div>
                    </header>
                </div>
            </template>
            <div class="slds-card__body slds-card__body_inner">
                <slot name="cardBody"></slot>
            </div>
            <footer if:true={isFooter} class="slds-card__footer">
                <slot name="cardFooter"></slot>
            </footer>
        </article>
    </template> 
</template>
